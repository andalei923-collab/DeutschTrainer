<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deutsch Trainer – Welten</title>
  <style>
    /* ── Reset & Design-Tokens ──────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c-bg:      #0f0e17;
      --c-surface: #1a1a2e;
      --c-card:    #16213e;
      --c-accent1: #e94560;
      --c-accent2: #f5a623;
      --c-accent3: #0fd4c8;
      --c-purple:  #a855f7;
      --c-text:    #eaeaea;
      --c-muted:   #8892a4;
      --nav-h:     64px;
      --top-h:     72px;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      background: var(--c-bg);
      background-image:
        radial-gradient(ellipse at 15% 0%,   #1e0a3c 0%, transparent 50%),
        radial-gradient(ellipse at 85% 100%, #0a1e3c 0%, transparent 50%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--c-text);
      display: flex;
      flex-direction: column;
      padding-top: var(--top-h);
      padding-bottom: calc(var(--nav-h) + 1rem);
    }

    /* ── Top-Bar ────────────────────────────────────────────── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--top-h);
      z-index: 100;
      background: rgba(22, 33, 62, .92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      gap: 1rem;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: .65rem;
      min-width: 0;
    }

    .avatar-bubble {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--c-surface);
      border: 2px solid var(--c-purple);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .player-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .player-name {
      font-weight: 700;
      font-size: .95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }

    .level-label {
      font-size: .72rem;
      color: var(--c-purple);
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .xp-track {
      width: 110px;
      height: 6px;
      border-radius: 99px;
      background: rgba(255,255,255,.1);
      overflow: hidden;
    }
    .xp-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--c-purple), var(--c-accent1));
      transition: width .6s cubic-bezier(.4,0,.2,1);
    }

    .stats {
      display: flex;
      align-items: center;
      gap: .6rem;
      flex-shrink: 0;
    }

    .stat-chip {
      display: flex;
      align-items: center;
      gap: .3rem;
      background: var(--c-surface);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 99px;
      padding: .4rem .65rem;
      font-size: .9rem;
      font-weight: 700;
      min-height: 36px;
    }
    .stat-chip.hearts { color: #ff6b8a; }
    .stat-chip.streak { color: var(--c-accent2); }

    .sound-btn {
      background: none;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 99px;
      color: var(--c-muted);
      font-size: 1.1rem;
      padding: .4rem .65rem;
      min-width: 40px;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .sound-btn:hover { color: var(--c-text); border-color: rgba(255,255,255,.3); }

    /* ── Haupt-Content ──────────────────────────────────────── */
    .main {
      flex: 1;
      padding: 1.5rem 1rem 0;
      max-width: 540px;
      width: 100%;
      margin: 0 auto;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1.2rem;
    }
    .section-title {
      font-size: 1.3rem;
      font-weight: 800;
    }
    .xp-total {
      font-size: .82rem;
      color: var(--c-muted);
    }
    .xp-total strong { color: var(--c-accent2); }

    /* ── Daily Challenge Banner ─────────────────────────────── */
    .daily-banner {
      display: flex;
      align-items: center;
      gap: .8rem;
      background: linear-gradient(135deg, #1a2a1a, #0d2e2d);
      border: 1px solid rgba(15,212,200,.2);
      border-radius: 14px;
      padding: .9rem 1.1rem;
      margin-bottom: 1.4rem;
      cursor: pointer;
      transition: transform .15s;
    }
    .daily-banner:hover { transform: translateY(-1px); }
    .daily-icon { font-size: 1.8rem; flex-shrink: 0; }
    .daily-text { flex: 1; }
    .daily-title {
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--c-accent3);
    }
    .daily-desc {
      font-size: .88rem;
      color: var(--c-muted);
      margin-top: .15rem;
    }
    .daily-badge {
      font-size: .75rem;
      font-weight: 700;
      background: var(--c-accent3);
      color: #000;
      border-radius: 99px;
      padding: .2rem .55rem;
      flex-shrink: 0;
    }
    .daily-badge.done { background: var(--c-muted); }

    /* ── Zurück-Button ─────────────────────────────────────── */
    .zurueck-link {
      display: inline-flex;
      align-items: center;
      color: var(--c-text);
      text-decoration: none;
      font-size: .85rem;
      font-weight: 600;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 99px;
      padding: .45rem .9rem;
      min-height: 44px;
      margin-bottom: 1rem;
      transition: background .15s, border-color .15s, color .15s;
    }
    .zurueck-link:hover {
      background: rgba(255,255,255,.15);
      color: #fff;
      border-color: rgba(255,255,255,.35);
    }

    /* ── Welten-Akkordeon ──────────────────────────────────── */
    .welten-liste {
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }

    .welt-akkordeon {
      border-radius: 18px;
      border: 1.5px solid rgba(255,255,255,.08);
      overflow: hidden;
    }
    .welt-akkordeon.locked { opacity: .5; }

    .welt-kopf {
      width: 100%;
      display: flex;
      align-items: center;
      gap: .8rem;
      padding: 1rem 1.2rem;
      border: none;
      color: var(--c-text);
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
      text-align: left;
    }
    .welt-kopf:hover:not(.disabled) { filter: brightness(1.1); }
    .welt-kopf.disabled { cursor: default; }

    .welt-kopf-icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      background: rgba(0,0,0,.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
    }

    .welt-kopf-info { flex: 1; min-width: 0; }
    .welt-kopf-name {
      font-size: 1rem;
      font-weight: 800;
    }
    .welt-kopf-fortschritt {
      font-size: .78rem;
      color: rgba(255,255,255,.6);
      margin-top: .15rem;
    }

    .welt-kopf-chevron {
      font-size: .9rem;
      color: rgba(255,255,255,.5);
      transition: transform .25s ease;
      flex-shrink: 0;
    }
    .welt-akkordeon.offen .welt-kopf-chevron {
      transform: rotate(180deg);
    }

    /* Welt-Farben */
    .welt-1 .welt-kopf { background: linear-gradient(135deg, #1a3a1a, #0d3d2a); }
    .welt-2 .welt-kopf { background: linear-gradient(135deg, #0d2040, #0a2e50); }
    .welt-3 .welt-kopf { background: linear-gradient(135deg, #3a1a0d, #50200a); }
    .welt-4 .welt-kopf { background: linear-gradient(135deg, #2a0d3a, #1e0a50); }
    .welt-5 .welt-kopf { background: linear-gradient(135deg, #3a2a00, #503a00); }

    /* ── Aufklappbarer Inhalt ──────────────────────────────── */
    .welt-inhalt {
      max-height: 0;
      overflow: hidden;
      transition: max-height .35s ease;
      background: rgba(0,0,0,.15);
    }

    .sub-liste {
      padding: .4rem .7rem .7rem;
      display: flex;
      flex-direction: column;
      gap: .35rem;
    }

    /* ── Unterwelt-Item ────────────────────────────────────── */
    .sub-item {
      display: flex;
      align-items: center;
      gap: .55rem;
      padding: .65rem .85rem;
      border-radius: 12px;
      border: 1.5px solid rgba(255,255,255,.06);
      background: rgba(255,255,255,.025);
      cursor: pointer;
      transition: background .15s, border-color .15s;
      font-family: inherit;
      color: var(--c-text);
      text-align: left;
      width: 100%;
    }
    .sub-item:hover:not(.sub-locked) {
      background: rgba(255,255,255,.06);
      border-color: rgba(255,255,255,.14);
    }
    .sub-item.sub-locked {
      opacity: .35;
      cursor: default;
    }
    .sub-item.sub-done {
      border-color: rgba(74,222,128,.2);
    }

    .sub-status { font-size: 1rem; flex-shrink: 0; width: 1.3rem; text-align: center; }
    .sub-nr     { font-size: .72rem; font-weight: 700; color: var(--c-muted); flex-shrink: 0; width: 1.6rem; }
    .sub-icon   { font-size: 1.05rem; flex-shrink: 0; }
    .sub-name   { flex: 1; font-size: .88rem; font-weight: 600; }
    .sub-stars  { font-size: .8rem; flex-shrink: 0; letter-spacing: 1px; }

    /* ── Boss-Item ─────────────────────────────────────────── */
    .boss-item {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .75rem .85rem;
      border-radius: 12px;
      border: 1.5px solid rgba(233,69,96,.2);
      background: rgba(233,69,96,.06);
      cursor: pointer;
      transition: background .15s, border-color .15s;
      margin-top: .25rem;
      font-family: inherit;
      color: var(--c-text);
      text-align: left;
      width: 100%;
    }
    .boss-item:hover:not(.boss-locked) {
      background: rgba(233,69,96,.12);
      border-color: rgba(233,69,96,.35);
    }
    .boss-item.boss-locked {
      opacity: .35;
      cursor: default;
    }
    .boss-item.boss-defeated {
      border-color: rgba(74,222,128,.25);
      background: rgba(74,222,128,.06);
    }

    .boss-icon { font-size: 1.3rem; flex-shrink: 0; }
    .boss-name { flex: 1; font-size: .88rem; font-weight: 700; }
    .boss-hp   { font-size: .72rem; font-weight: 700; color: var(--c-accent1); white-space: nowrap; }
    .boss-defeated .boss-hp { color: var(--c-accent3); }
    .boss-lock { font-size: .85rem; flex-shrink: 0; }

    /* ── Bottom-Nav ─────────────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: rgba(22, 33, 62, .96);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,.07);
      display: flex;
      align-items: stretch;
      z-index: 100;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .2rem;
      text-decoration: none;
      color: var(--c-muted);
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .04em;
      transition: color .15s;
    }
    .nav-item .nav-icon { font-size: 1.4rem; line-height: 1; }
    .nav-item.active { color: var(--c-accent3); }
    .nav-item:hover  { color: var(--c-text); }

  </style>
</head>
<body>

  <!-- ── Top-Bar ──────────────────────────────────────────── -->
  <header class="topbar">
    <div class="player-info">
      <div class="avatar-bubble" id="avatarBubble">🦊</div>
      <div class="player-meta">
        <span class="player-name" id="playerName">Spieler</span>
        <span class="level-label" id="levelLabel">Level 1</span>
        <div class="xp-track">
          <div class="xp-fill" id="xpFill" style="width:0%"></div>
        </div>
      </div>
    </div>
    <div class="stats">
      <div class="stat-chip streak">🔥 <span id="streakCount">0</span></div>
      <div class="stat-chip hearts">❤️ <span id="heartsCount">5</span></div>
      <button class="sound-btn" id="soundToggleBtn" title="Sound">🔊</button>
      <button class="hilfe-btn" id="hilfeBtn" title="Tutorial / Hilfe" onclick="tutorialAnzeigen()">?</button>
    </div>
  </header>

  <!-- ── Haupt-Content ─────────────────────────────────────── -->
  <main class="main">

    <a href="index.html" class="zurueck-link">← Zurück</a>

    <div class="section-header">
      <h1 class="section-title">Deine Welten 🗺️</h1>
      <span class="xp-total"><strong id="xpTotal">0</strong> XP gesamt</span>
    </div>

    <!-- Daily Challenge -->
    <div class="daily-banner" id="dailyBanner" role="button" tabindex="0">
      <span class="daily-icon">⚡</span>
      <div class="daily-text">
        <div class="daily-title">Tägliche Challenge</div>
        <div class="daily-desc" id="dailyDesc">Lade …</div>
      </div>
      <span class="daily-badge" id="dailyBadge">NEU</span>
    </div>

    <!-- Welten -->
    <div class="welten-liste" id="weltenListe"></div>

  </main>

  <!-- ── Bottom-Nav ────────────────────────────────────────── -->
  <nav class="bottom-nav" aria-label="Hauptnavigation">
    <a href="app.html"         class="nav-item active">
      <span class="nav-icon">🗺️</span>Welten
    </a>
    <a href="themen.html"      class="nav-item">
      <span class="nav-icon">📚</span>Themen
    </a>
    <a href="profile.html"    class="nav-item">
      <span class="nav-icon">👤</span>Profil
    </a>
    <a href="leaderboard.html" class="nav-item">
      <span class="nav-icon">🏆</span>Rangliste
    </a>
  </nav>

  <script src="js/storage.js?v=0.3"></script>
  <script src="js/sound.js?v=0.3"></script>
  <script src="js/xp.js?v=0.3"></script>
  <script src="js/tutorial.js?v=1.0"></script>
  <script>
    // ── Konstanten ────────────────────────────────────────────
    const AVATAR_MAP = {
      fuchs:'🦊', frosch:'🐸', panda:'🐼', waschbaer:'🦝', wolf:'🐺',
      koala:'🐨', hund:'🐶', affe:'🐵', loewe:'🦁', tiger:'🐯',
      baer:'🐻', katze:'🐱', kuh:'🐮', schlange:'🐍', papagei:'🦜',
      default:'😊',
    };

    const WELTEN = [
      {
        nr: 1, icon: '🌱', name: 'Wortarten & Grundlagen',
        boss: { name: 'Der Wort-Kobold', hp: 15, icon: '👺' },
        subs: [
          { name: 'Nomen', icon: '📝' },
          { name: 'Verben', icon: '🏃' },
          { name: 'Adjektive', icon: '🎨' },
          { name: 'Artikel (der/die/das)', icon: '📌' },
          { name: 'Pronomen', icon: '👆' },
        ],
      },
      {
        nr: 2, icon: '🏗️', name: 'Satzbau & Grammatik',
        boss: { name: 'Der Grammatik-Troll', hp: 15, icon: '🧌' },
        subs: [
          { name: 'Satzglieder', icon: '🧩' },
          { name: 'Die 4 Fälle', icon: '📦' },
          { name: 'Zeitformen', icon: '⏳' },
          { name: 'Satzzeichen', icon: '✏️' },
          { name: 'Nebensätze', icon: '🔗' },
        ],
      },
      {
        nr: 3, icon: '🔥', name: 'Rechtschreibung & Ausdruck',
        boss: { name: 'Die Rechtschreib-Hexe', hp: 15, icon: '🧙‍♀️' },
        subs: [
          { name: 'Groß-/Kleinschreibung', icon: '🔠' },
          { name: 'Getrennt-/Zusammenschreibung', icon: '🔀' },
          { name: 'Synonyme & Antonyme', icon: '🔄' },
          { name: 'Fremdwörter', icon: '🌍' },
          { name: 'Redewendungen', icon: '💬' },
        ],
      },
      {
        nr: 4, icon: '⚡', name: 'Texte & Kommunikation',
        boss: { name: 'Der Text-Golem', hp: 15, icon: '🗿' },
        subs: [
          { name: 'Textarten erkennen', icon: '📄' },
          { name: 'Berichte schreiben', icon: '📰' },
          { name: 'Briefe & E-Mails', icon: '📧' },
          { name: 'Bewerbung', icon: '💼' },
          { name: 'Zusammenfassungen', icon: '📋' },
        ],
      },
      {
        nr: 5, icon: '🌟', name: 'Der Endkampf',
        boss: { name: 'Der Deutsch-Drache', hp: 15, icon: '🐉' },
        subs: [
          { name: 'Wortarten-Wiederholung', icon: '🌱' },
          { name: 'Grammatik-Wiederholung', icon: '🏗️' },
          { name: 'Rechtschreibung-Wiederholung', icon: '🔥' },
          { name: 'Text-Wiederholung', icon: '⚡' },
          { name: 'Generalprobe', icon: '🎯' },
        ],
      },
    ];

    // ── Topbar befüllen ───────────────────────────────────────
    function renderTopbar(spieler) {
      document.getElementById('avatarBubble').textContent =
        AVATAR_MAP[spieler.avatar] ?? '😊';
      document.getElementById('playerName').textContent  = spieler.name;
      document.getElementById('levelLabel').textContent  = `Level ${spieler.level}`;
      document.getElementById('streakCount').textContent = spieler.streak;
      document.getElementById('heartsCount').textContent = spieler.hearts;
      document.getElementById('xpTotal').textContent     = spieler.xp.toLocaleString('de');

      const pct = (typeof xpFortschrittProzent === 'function')
        ? xpFortschrittProzent(spieler.xp, spieler.level)
        : 0;
      document.getElementById('xpFill').style.width = pct + '%';
    }

    // ── Daily Challenge ───────────────────────────────────────
    function renderDaily() {
      const daily   = dailyChallengeLaden();
      const heute   = new Date().toISOString().slice(0, 10);
      const frisch  = daily.datum !== heute;

      const desc    = frisch
        ? 'Neue Aufgabe wartet auf dich!'
        : (daily.aufgabe?.titel ?? 'Tägliche Aufgabe');
      const erledigt = !frisch && daily.erledigt;

      document.getElementById('dailyDesc').textContent  = desc;
      const badge = document.getElementById('dailyBadge');
      badge.textContent  = erledigt ? '✓ Erledigt' : (frisch ? 'NEU' : 'Offen');
      badge.className    = 'daily-badge' + (erledigt ? ' done' : '');
    }

    // ── Sterne-Anzeige ──────────────────────────────────────
    function renderStars(stars) {
      return '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    }

    // ── Welten-Liste rendern (Akkordeon) ─────────────────────
    function renderWelten(fortschritt) {
      const liste = document.getElementById('weltenListe');
      liste.innerHTML = '';

      // Bestimme welche Welt auto-geöffnet wird (letzte freigeschaltete)
      let autoOpenNr = 0;
      for (let i = fortschritt.length - 1; i >= 0; i--) {
        if (fortschritt[i].unlocked) { autoOpenNr = i; break; }
      }

      WELTEN.forEach((w, i) => {
        const fs     = fortschritt[i];
        const locked = !fs.unlocked;
        const completedSubs = fs.subwelten.filter(s => s.completed).length;
        const allSubsDone   = completedSubs === 5;

        const akkordeon = document.createElement('div');
        akkordeon.className = `welt-akkordeon welt-${w.nr}${locked ? ' locked' : ''}`;

        // ── Kopfzeile ──
        const kopf = document.createElement('button');
        kopf.className = `welt-kopf${locked ? ' disabled' : ''}`;
        kopf.setAttribute('aria-expanded', 'false');

        let fortschrittText = 'Gesperrt';
        if (!locked) {
          fortschrittText = fs.bossDefeated
            ? '✅ Abgeschlossen'
            : `${completedSubs}/5 Unterwelten`;
        }

        kopf.innerHTML = `
          <div class="welt-kopf-icon">${locked ? '🔒' : w.icon}</div>
          <div class="welt-kopf-info">
            <div class="welt-kopf-name">Welt ${w.nr}: ${w.name}</div>
            <div class="welt-kopf-fortschritt">${fortschrittText}</div>
          </div>
          ${locked ? '' : '<span class="welt-kopf-chevron">▼</span>'}
        `;

        if (!locked) {
          kopf.addEventListener('click', () => {
            const offen = akkordeon.classList.toggle('offen');
            kopf.setAttribute('aria-expanded', offen);
            const inhalt = akkordeon.querySelector('.welt-inhalt');
            if (offen) {
              inhalt.style.maxHeight = inhalt.scrollHeight + 'px';
              // Andere Akkordeons schließen
              document.querySelectorAll('.welt-akkordeon.offen').forEach(other => {
                if (other !== akkordeon) {
                  other.classList.remove('offen');
                  other.querySelector('.welt-kopf').setAttribute('aria-expanded', 'false');
                  other.querySelector('.welt-inhalt').style.maxHeight = '0';
                }
              });
            } else {
              inhalt.style.maxHeight = '0';
            }
          });
        }

        akkordeon.appendChild(kopf);

        // ── Inhalt (nur für freigeschaltete Welten) ──
        if (!locked) {
          const inhalt = document.createElement('div');
          inhalt.className = 'welt-inhalt';

          const subListe = document.createElement('div');
          subListe.className = 'sub-liste';

          w.subs.forEach((sub, j) => {
            const subFs      = fs.subwelten[j];
            const subUnlocked = j === 0 || fs.subwelten[j - 1].completed;
            const subDone    = subFs.completed;

            const item = document.createElement('button');
            item.className = `sub-item${!subUnlocked ? ' sub-locked' : ''}${subDone ? ' sub-done' : ''}`;
            item.innerHTML = `
              <span class="sub-status">${subDone ? '✅' : subUnlocked ? '▶️' : '🔒'}</span>
              <span class="sub-nr">${w.nr}.${j + 1}</span>
              <span class="sub-icon">${sub.icon}</span>
              <span class="sub-name">${sub.name}</span>
              ${subDone ? '<span class="sub-stars">' + renderStars(subFs.stars) + '</span>' : ''}
            `;

            if (subUnlocked) {
              item.addEventListener('click', () => oeffneSub(w.nr, j + 1));
            }

            subListe.appendChild(item);
          });

          // ── Boss ──
          const bossUnlocked = allSubsDone;
          const bossItem = document.createElement('button');
          bossItem.className = `boss-item${!bossUnlocked ? ' boss-locked' : ''}${fs.bossDefeated ? ' boss-defeated' : ''}`;
          bossItem.innerHTML = `
            <span class="boss-icon">${w.boss.icon}</span>
            <span class="boss-name">BOSS: ${w.boss.name}</span>
            <span class="boss-hp">${fs.bossDefeated ? '✅ Besiegt' : w.boss.hp + ' HP'}</span>
            ${!bossUnlocked && !fs.bossDefeated ? '<span class="boss-lock">🔒</span>' : ''}
          `;

          if (bossUnlocked && !fs.bossDefeated) {
            bossItem.addEventListener('click', () => oeffneBoss(w.nr));
          }

          subListe.appendChild(bossItem);
          inhalt.appendChild(subListe);
          akkordeon.appendChild(inhalt);

          // Auto-öffnen
          if (i === autoOpenNr) {
            akkordeon.classList.add('offen');
            kopf.setAttribute('aria-expanded', 'true');
            requestAnimationFrame(() => {
              inhalt.style.maxHeight = inhalt.scrollHeight + 'px';
            });
          }
        }

        liste.appendChild(akkordeon);
      });
    }

    // ── Navigation ────────────────────────────────────────────
    function oeffneSub(weltNr, subNr) {
      window.location.href = `quiz.html?welt=${weltNr}&sub=${subNr}`;
    }

    function oeffneBoss(weltNr) {
      window.location.href = `quiz.html?welt=${weltNr}&boss=1`;
    }

    document.getElementById('dailyBanner').addEventListener('click', () => {
      window.location.href = 'quiz.html?daily=1&phase=quiz';
    });
    document.getElementById('dailyBanner').addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') window.location.href = 'quiz.html?daily=1&phase=quiz';
    });

    // ── Initialisierung ───────────────────────────────────────
    (function init() {
      if (typeof migrieren === 'function') migrieren();

      const spieler     = spielerLaden();
      const fortschritt = fortschrittLaden();

      // Kein Profil → zurück zur Startseite
      if (!spieler.name || spieler.name === 'Spieler') {
        const hatName = localStorage.getItem('dt_spieler');
        if (!hatName) {
          window.location.href = 'index.html';
          return;
        }
      }

      renderTopbar(spieler);
      renderWelten(fortschritt);
      renderDaily();
      soundToggleInit('soundToggleBtn');

      // Tutorial beim ersten Besuch anzeigen
      if (typeof tutorialInit === 'function') tutorialInit();
    })();

    // ── Cheat-Code: "testmodus" tippen → alle Welten freischalten ──
    (function() {
      const CODE = 'testmodus';
      let buf = '';
      let aktiv = false;

      document.addEventListener('keydown', e => {
        if (e.ctrlKey || e.altKey || e.metaKey) return;
        if (e.key.length !== 1) return;
        buf += e.key.toLowerCase();
        if (buf.length > CODE.length) buf = buf.slice(-CODE.length);
        if (buf !== CODE) return;
        buf = '';

        const fortschritt = fortschrittLaden();

        if (!aktiv) {
          // Alles spielbar machen (aber nichts als besiegt/erledigt markieren)
          for (let i = 0; i < fortschritt.length; i++) {
            fortschritt[i].unlocked = true;
            fortschritt[i].bossDefeated = false;
            for (let s = 0; s < fortschritt[i].subwelten.length; s++) {
              fortschritt[i].subwelten[s].completed = true;
              fortschritt[i].subwelten[s].sterne = 0;
            }
          }
          fortschrittSpeichern(fortschritt);
          aktiv = true;
          _cheatToast('\uD83D\uDD13 Testmodus aktiviert \u2014 alle Welten freigeschaltet!');
        } else {
          // Zurücksetzen auf Anfang (nur Welt 1 offen)
          for (let i = 0; i < fortschritt.length; i++) {
            fortschritt[i].unlocked = i === 0;
            fortschritt[i].bossDefeated = false;
            for (let s = 0; s < fortschritt[i].subwelten.length; s++) {
              fortschritt[i].subwelten[s].completed = false;
              fortschritt[i].subwelten[s].sterne = 0;
            }
          }
          fortschrittSpeichern(fortschritt);
          aktiv = false;
          _cheatToast('\uD83D\uDD12 Testmodus deaktiviert');
        }

        // Welten-Karte neu rendern
        const liste = document.querySelector('.welten-liste');
        if (liste) { liste.innerHTML = ''; renderWelten(fortschrittLaden()); }
      });

      function _cheatToast(text) {
        const el = document.createElement('div');
        el.textContent = text;
        Object.assign(el.style, {
          position: 'fixed', bottom: '2rem', left: '50%', transform: 'translateX(-50%)',
          background: '#1a1a2e', color: '#fff', padding: '.6rem 1.2rem',
          borderRadius: '8px', fontSize: '.9rem', fontWeight: '600',
          zIndex: '9999', boxShadow: '0 4px 16px rgba(0,0,0,.3)',
          transition: 'opacity .4s', opacity: '1',
        });
        document.body.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 400); }, 2500);
      }
    })();
  </script>
</body>
</html>
