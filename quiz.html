<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deutsch Trainer – Quiz</title>
  <link rel="stylesheet" href="css/avatar.css?v=0.3" />
  <link rel="stylesheet" href="css/quiz.css?v=0.3" />
  <style>
    /* ── Design-Tokens (identisch mit index/app) ────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c-bg:      #0f0e17;
      --c-surface: #1a1a2e;
      --c-card:    #16213e;
      --c-accent1: #e94560;
      --c-accent2: #f5a623;
      --c-accent3: #0fd4c8;
      --c-purple:  #a855f7;
      --c-text:    #eaeaea;
      --c-muted:   #8892a4;
      --radius:    16px;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      background: var(--c-bg);
      background-image:
        radial-gradient(ellipse at 20% 0%,  #1e0a3c 0%, transparent 55%),
        radial-gradient(ellipse at 80% 100%, #0a1e3c 0%, transparent 55%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--c-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
    }

    /* ── Zurück-Link ────────────────────────────────────────── */
    .quiz-toprow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 520px;
      margin-bottom: 1.2rem;
    }
    .back-link {
      color: var(--c-muted);
      text-decoration: none;
      font-size: .85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: .35rem;
      transition: color .15s;
    }
    .back-link:hover { color: var(--c-text); }
    .sound-btn {
      background: none;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 99px;
      color: var(--c-muted);
      font-size: 1.1rem;
      padding: .4rem .7rem;
      min-width: 44px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .sound-btn:hover { color: var(--c-text); border-color: rgba(255,255,255,.3); }

    /* ── Thema-Badge ────────────────────────────────────────── */
    .thema-badge {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--c-accent3);
      background: rgba(15,212,200,.12);
      border: 1px solid rgba(15,212,200,.25);
      border-radius: 99px;
      padding: .25rem .75rem;
      margin-bottom: 1rem;
      align-self: center;
    }

    /* ── Avatar-Bereich ─────────────────────────────────────── */
    .avatar-bereich {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: .6rem;
    }

    /* ── Satz-Übersetzung ───────────────────────────────────── */
    .uebers-block {
      margin-top: .5rem;
      margin-bottom: .2rem;
    }
    .uebers-btn {
      font-size: .72rem;
      font-weight: 600;
      background: rgba(15,212,200,.07);
      border: 1px solid rgba(15,212,200,.22);
      border-radius: 99px;
      color: var(--c-accent3);
      padding: .28rem .8rem;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    .uebers-btn:hover    { background: rgba(15,212,200,.15); }
    .uebers-btn:disabled { opacity: .5; cursor: default; }
    .uebers-ausgabe {
      font-size: .88rem;
      color: var(--c-muted);
      line-height: 1.65;
      margin-top: .45rem;
      padding: .5rem .75rem;
      background: rgba(255,255,255,.04);
      border-left: 2px solid var(--c-accent3);
      border-radius: 0 8px 8px 0;
    }

    /* ── Herzen-Anzeige ─────────────────────────────────────── */
    .herzen-anzeige {
      font-size: 1.35rem;
      letter-spacing: .08rem;
      margin-bottom: 1rem;
      min-height: 1.8rem;
      text-align: center;
      overflow-wrap: break-word;
      max-width: 100%;
    }

    #avatar-container { /* avatar.js rendert hier hinein */
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 110px;
    }

    /* ── Inhaltskarte ───────────────────────────────────────── */
    .karte {
      background: var(--c-card);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: var(--radius);
      padding: 1.6rem 1.5rem;
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* ── Titel ──────────────────────────────────────────────── */
    .theorie-titel {
      font-size: clamp(1.3rem, 4vw, 1.7rem);
      font-weight: 900;
      line-height: 1.2;
    }

    /* ── Erklärungstext ─────────────────────────────────────── */
    .erklaerung {
      font-size: .97rem;
      line-height: 1.7;
      color: #d0d8e8;
    }

    /* ── Tap-to-Translate: anklickbare Wörter ───────────────── */
    span.wort {
      cursor: pointer;
      border-bottom: 1.5px dotted rgba(168,85,247,.55);
      transition: color .12s, border-color .12s;
      position: relative;
    }
    span.wort:hover  { color: var(--c-purple); border-color: var(--c-purple); }
    span.wort:focus  { outline: 2px solid var(--c-purple); border-radius: 2px; }
    span.wort.active { color: var(--c-accent3); }

    /* ── Beispiel-Block ─────────────────────────────────────── */
    .beispiel-block {
      background: rgba(168,85,247,.08);
      border-left: 3px solid var(--c-purple);
      border-radius: 0 12px 12px 0;
      padding: .9rem 1.1rem;
    }
    .beispiel-label {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--c-purple);
      margin-bottom: .4rem;
    }
    .beispiel-satz {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.6;
      color: #e8e0f8;
    }
    .beispiel-satz .highlight {
      color: var(--c-accent2);
      font-weight: 800;
    }

    /* ── Merkhilfe ──────────────────────────────────────────── */
    .merkhilfe {
      display: flex;
      gap: .8rem;
      align-items: flex-start;
      background: rgba(245,166,35,.07);
      border: 1px solid rgba(245,166,35,.18);
      border-radius: 12px;
      padding: .85rem 1rem;
    }
    .merkhilfe-icon { font-size: 1.4rem; flex-shrink: 0; line-height: 1.4; }
    .merkhilfe-text {
      font-size: .88rem;
      line-height: 1.6;
      color: #ddd0b8;
    }

    /* ── Wie erkennen (Themen-Theorie) ────────────────────── */
    .wie-erkennen {
      display: flex;
      gap: .8rem;
      align-items: flex-start;
      background: rgba(15,212,200,.07);
      border: 1px solid rgba(15,212,200,.18);
      border-radius: 12px;
      padding: .85rem 1rem;
    }
    .wie-erkennen-icon { font-size: 1.4rem; flex-shrink: 0; line-height: 1.4; }
    .wie-erkennen-text {
      font-size: .88rem;
      line-height: 1.6;
      color: #b8ddd8;
    }

    /* ── Start-Button ───────────────────────────────────────── */
    .start-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--c-purple), var(--c-accent1));
      color: #fff;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: .04em;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(168,85,247,.35);
      transition: transform .15s, box-shadow .15s;
      margin-top: .4rem;
    }
    .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(168,85,247,.45); }
    .start-btn:active { transform: translateY(0); }
    .btn-arrow { font-size: 1.2rem; }

    /* ── Übersetzungs-Popup ─────────────────────────────────── */
    #translate-popup {
      position: fixed;
      background: #1e1e3a;
      border: 1px solid var(--c-purple);
      border-radius: 10px;
      padding: .45rem .85rem;
      font-size: .88rem;
      font-weight: 600;
      color: var(--c-text);
      pointer-events: none;
      z-index: 999;
      white-space: normal;
      max-width: calc(100vw - 2rem);
      box-shadow: 0 4px 18px rgba(0,0,0,.55);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .15s, transform .15s;
    }
    #translate-popup.sichtbar {
      opacity: 1;
      transform: translateY(0);
    }
    #translate-popup .popup-sprache {
      font-size: .65rem;
      color: var(--c-muted);
      display: block;
      margin-bottom: .1rem;
    }

    /* ── Quiz-Zurück-Button (sichtbar als Pill-Button) ─────── */
    .back-link.quiz-zurueck {
      color: var(--c-text);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 99px;
      padding: .45rem .9rem;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }
    .back-link.quiz-zurueck:hover {
      background: rgba(255,255,255,.15);
      color: #fff;
      border-color: rgba(255,255,255,.35);
    }

    /* ── Abbruch-Bestätigung Modal ──────────────────────────── */
    #abbruch-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    #abbruch-modal.sichtbar { display: flex; }
    .abbruch-inhalt {
      background: var(--c-card);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: var(--radius);
      padding: 1.8rem 1.5rem;
      max-width: 340px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: .75rem;
      text-align: center;
    }
    .abbruch-text {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.4;
    }
    .abbruch-sub {
      font-size: .88rem;
      color: var(--c-muted);
      line-height: 1.55;
    }
    .abbruch-btns {
      display: flex;
      flex-direction: column;
      gap: .6rem;
      margin-top: .5rem;
    }
    .abbruch-ja {
      padding: .8rem;
      border: none;
      border-radius: 12px;
      background: var(--c-accent1);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;
    }
    .abbruch-ja:hover { opacity: .85; }
    .abbruch-nein {
      padding: .8rem;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px;
      background: transparent;
      color: var(--c-text);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .abbruch-nein:hover { background: rgba(255,255,255,.06); }

    /* ── Boss-Kampf UI ──────────────────────────────────────── */
    .boss-modus {
      background: var(--c-bg) !important;
      background-image: var(--boss-bg, linear-gradient(135deg, #0d0d1a, #1a0d2e)) !important;
    }

    .boss-arena {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
      background: rgba(0,0,0,.35);
      border: 1.5px solid rgba(233,69,96,.25);
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(233,69,96,.15);
    }

    .boss-figur {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(233,69,96,.12);
      border: 2px solid rgba(233,69,96,.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      transition: transform .15s;
    }
    .boss-figur.boss-endgegner {
      width: 96px;
      height: 96px;
      border-color: rgba(220,38,38,.6);
      background: rgba(220,38,38,.15);
      box-shadow: 0 0 24px rgba(220,38,38,.35), 0 0 48px rgba(220,38,38,.15);
      animation: drachen-glut 2s ease-in-out infinite;
    }
    @keyframes drachen-glut {
      0%, 100% { box-shadow: 0 0 24px rgba(220,38,38,.35), 0 0 48px rgba(220,38,38,.15); }
      50% { box-shadow: 0 0 32px rgba(255,60,20,.5), 0 0 64px rgba(255,60,20,.25); }
    }

    .boss-emoji {
      font-size: 2.2rem;
      line-height: 1;
    }
    .boss-endgegner .boss-emoji {
      font-size: 2.8rem;
    }

    .boss-info {
      flex: 1;
      min-width: 0;
    }

    .boss-namen-zeile {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: .5rem;
      margin-bottom: .4rem;
    }

    .boss-kampf-name {
      font-size: .88rem;
      font-weight: 800;
      color: var(--c-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .boss-hp-text {
      font-size: .72rem;
      font-weight: 700;
      color: var(--c-accent1);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .boss-hp-leiste {
      width: 100%;
      height: 10px;
      background: rgba(255,255,255,.08);
      border-radius: 99px;
      overflow: hidden;
    }

    .boss-hp-fill {
      height: 100%;
      border-radius: 99px;
      transition: width .4s ease;
    }

    /* Boss-Treffer-Animation */
    @keyframes boss-wackeln {
      0%, 100% { transform: translateX(0); }
      15%  { transform: translateX(-8px) rotate(-3deg); }
      30%  { transform: translateX(8px) rotate(3deg); }
      45%  { transform: translateX(-6px) rotate(-2deg); }
      60%  { transform: translateX(6px) rotate(2deg); }
      75%  { transform: translateX(-3px); }
      90%  { transform: translateX(3px); }
    }
    .boss-getroffen {
      animation: boss-wackeln .5s ease;
    }

    /* Schadens-Popup über dem Boss */
    .boss-schaden-popup {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: .85rem;
      font-weight: 800;
      color: #ef4444;
      text-shadow: 0 2px 4px rgba(0,0,0,.5);
      pointer-events: none;
      animation: schaden-hoch .85s ease forwards;
    }
    @keyframes schaden-hoch {
      0%   { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-30px); }
    }

    /* Screen-Shake bei Spieler-Schaden */
    @keyframes screen-shake {
      0%, 100% { transform: translateX(0); }
      20%  { transform: translateX(-4px); }
      40%  { transform: translateX(4px); }
      60%  { transform: translateX(-3px); }
      80%  { transform: translateX(3px); }
    }
    .boss-shake {
      animation: screen-shake .4s ease;
    }

    /* ── Boss Sieg-Screen ──────────────────────────────────── */
    .boss-sieg-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: .8rem;
      padding: .5rem 0;
    }
    .boss-sieg-icon {
      font-size: 3.5rem;
      opacity: .6;
      filter: grayscale(.7);
    }
    .boss-sieg-text {
      font-size: 1.4rem;
      font-weight: 900;
      color: #4ade80;
      text-shadow: 0 2px 12px rgba(74,222,128,.3);
    }
    .boss-sieg-sterne {
      font-size: 1.8rem;
      letter-spacing: 4px;
    }
    .boss-sieg-stats {
      display: flex;
      flex-direction: column;
      gap: .25rem;
      font-size: .9rem;
      margin: .3rem 0;
    }
    .boss-sieg-unlock {
      font-size: 1rem;
      font-weight: 700;
      color: var(--c-accent2);
      background: rgba(245,166,35,.08);
      border: 1px solid rgba(245,166,35,.2);
      border-radius: 12px;
      padding: .6rem 1.2rem;
      margin-top: .3rem;
    }

    /* ── Boss Niederlage-Screen ────────────────────────────── */
    .boss-niederlage-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: .8rem;
      padding: .5rem 0;
    }
    .boss-niederlage-icon {
      font-size: 3rem;
    }
    .boss-niederlage-text {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--c-accent1);
    }
    .boss-niederlage-sub {
      font-size: .92rem;
      color: var(--c-muted);
      line-height: 1.6;
      white-space: pre-line;
    }
    .boss-niederlage-stats {
      display: flex;
      flex-direction: column;
      gap: .25rem;
      font-size: .9rem;
      margin: .3rem 0;
    }

    /* ── Fortschrittsleiste oben ────────────────────────────── */
    .fortschritt-leiste {
      width: 100%;
      max-width: 520px;
      height: 5px;
      background: rgba(255,255,255,.08);
      border-radius: 99px;
      margin-bottom: 1.2rem;
      overflow: hidden;
    }
    .fortschritt-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--c-purple), var(--c-accent3));
      border-radius: 99px;
      transition: width .4s ease;
    }
  </style>
</head>
<body>

  <!-- Zurück + Sound-Toggle -->
  <div class="quiz-toprow">
    <a href="app.html" class="back-link" id="backLink">← Weltenübersicht</a>
    <button class="sound-btn" id="soundToggleBtn" title="Sound">🔊</button>
  </div>

  <!-- Fortschritt -->
  <div class="fortschritt-leiste" aria-hidden="true">
    <div class="fortschritt-fill" id="fortschrittFill" style="width:0%"></div>
  </div>

  <!-- Thema-Badge -->
  <div class="thema-badge" id="themaBadge">Welt 1 · 1. Klasse</div>

  <!-- Avatar -->
  <div class="avatar-bereich">
    <div id="avatar-container"></div>
  </div>

  <!-- Herzen-Anzeige -->
  <div class="herzen-anzeige" id="herzenAnzeige" aria-label="Herzen"></div>

  <!-- Inhaltskarte -->
  <div class="karte" id="theoriKarte">

    <h1 class="theorie-titel" id="theorieTitel">Lade …</h1>

    <p class="erklaerung" id="erklaerungText"></p>

    <div class="beispiel-block">
      <div class="beispiel-label">Beispiel</div>
      <div class="beispiel-satz" id="beispielSatz"></div>
    </div>

    <div class="merkhilfe">
      <span class="merkhilfe-icon">💡</span>
      <span class="merkhilfe-text" id="merkhilfeText"></span>
    </div>

    <div class="wie-erkennen" id="wieErkennenBlock" style="display:none">
      <span class="wie-erkennen-icon">🔍</span>
      <span class="wie-erkennen-text" id="wieErkennenText"></span>
    </div>

    <button class="start-btn" id="startBtn">
      Los geht's! <span class="btn-arrow">→</span>
    </button>

  </div>

  <!-- Abbruch-Bestätigung -->
  <div id="abbruch-modal" role="dialog" aria-modal="true" aria-labelledby="abbruchTitel">
    <div class="abbruch-inhalt">
      <p class="abbruch-text" id="abbruchTitel">
        Möchtest du wirklich aufhören?
      </p>
      <p class="abbruch-sub">
        Dein Fortschritt in dieser Runde geht verloren.
      </p>
      <div class="abbruch-btns">
        <button class="abbruch-ja"  id="abbruchJa">Ja, aufhören</button>
        <button class="abbruch-nein" id="abbruchNein">Weiter spielen</button>
      </div>
    </div>
  </div>

  <!-- Übersetzungs-Popup -->
  <div id="translate-popup" role="tooltip" aria-live="polite">
    <span class="popup-sprache" id="popupSprache"></span>
    <span id="popupText"></span>
  </div>

  <script src="js/storage.js?v=0.3"></script>
  <script src="js/sound.js?v=0.3"></script>
  <script src="js/xp.js?v=0.3"></script>
  <script src="js/streak.js?v=0.3"></script>
  <script src="js/avatar.js?v=0.3"></script>
  <script src="js/achievements.js?v=0.3"></script>
  <script src="js/accessoires.js?v=0.3"></script>
  <script src="js/quiz.js?v=0.3"></script>
  <script src="data/klasse1.js"></script>
  <script src="data/klasse2.js"></script>
  <script src="data/klasse3.js"></script>
  <script src="data/klasse4.js"></script>
  <script src="data/klasse5.js"></script>
  <script src="data/themen.js"></script>
  <script src="data/welt1.js"></script>
  <script src="data/welt2.js"></script>
  <script src="data/welt3.js"></script>
  <script src="data/welt4.js"></script>
  <script>
    // ================================================================
    //  Beispiel-Fragen pro Welt (Fallback bis data/klasse*.js existiert)
    //  Zeigt alle 11 Fragetypen als Demo
    // ================================================================
    const BEISPIEL_FRAGEN = {
      1: [
        {
          typ: 'multiple_choice',
          frage: 'Welches Wort ist ein Nomen (Substantiv)?',
          optionen: ['laufen', 'schön', 'der Hund', 'schnell'],
          richtig: 2,
          erklaerung: 'Nomen schreibt man groß und sie bezeichnen Dinge, Lebewesen oder Orte.',

    // ================================================================

    // ================================================================

    // Fisher-Yates Shuffle (Hilfsfunktion)
    function _fisherYates(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Alle Fragen einer Welt sammeln (WELT-Daten)
    function _alleFragenAusWelt(weltNr) {
      const weltDaten = {
        1: typeof WELT1 !== 'undefined' ? WELT1 : null,
        2: typeof WELT2 !== 'undefined' ? WELT2 : null,
        3: typeof WELT3 !== 'undefined' ? WELT3 : null,
        4: typeof WELT4 !== 'undefined' ? WELT4 : null,
      };
      const welt = weltDaten[weltNr];
      if (!welt) return [];
      const fragen = [];
      for (let s = 1; s <= 5; s++) {
        const sub = welt[weltNr + '-' + s];
        if (sub?.fragen?.length) fragen.push(...sub.fragen);
      }
      return fragen;
    }

    // Falsch beantwortete Frage speichern
    function _falscheFrageSpeichern(frage) {
      try {
        const liste = _falscheFragenLaden();

        if (!liste.some(f => f.frage === frage.frage)) {
          liste.push(frage);
          // Max 200 speichern (älteste entfernen)
          if (liste.length > 200) liste.splice(0, liste.length - 200);
          localStorage.setItem('dt_falsche_fragen', JSON.stringify(liste));
        }
      } catch { /* localStorage voll – ignorieren */ }
    }

    function _falscheFrageEntfernen(frage) {
      try {
        const liste = _falscheFragenLaden();
        const neu = liste.filter(f => f.frage !== frage.frage);
        if (neu.length !== liste.length) {

        }

    // Einfacher String-Hash für Frage-Schlüssel
    function _frageHash(frage) {
      const s = frage.frage || '';
      let h = 0;
      for (let i = 0; i < s.length; i++) {
        h = ((h << 5) - h + s.charCodeAt(i)) | 0;
      }
      return 'q' + (h >>> 0).toString(36);
    }

    function _statsLaden() {
      try {
        const raw = localStorage.getItem(_STATS_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch { return {}; }
    }

    // Stats speichern
    function _statsSpeichern(stats) {
      try { localStorage.setItem(_STATS_KEY, JSON.stringify(stats)); } catch {}
    }

    // Einzelne Frage-Stat aktualisieren (aufgerufen aus quiz.js)
    function _frageStatAktualisieren(frage, richtig) {
      const stats = _statsLaden();
      const key = _frageHash(frage);
      if (!stats[key]) stats[key] = { r: 0, f: 0 };
      if (richtig) stats[key].r++;
      else stats[key].f++;
      _statsSpeichern(stats);
    }

    // Cooldown aktualisieren (aufgerufen aus quiz.js bei jeder gezeigten Frage)
    function _cooldownAktualisieren(frage) {
      const text = frage.frage || '';
      _cooldownListe.push(text);
      if (_cooldownListe.length > 5) _cooldownListe.shift();
    }

    // Gewichtete Auswahl aus einem Fragenpool
    function _gewichteteAuswahl(pool, anzahl) {
      if (!pool.length) return [];
      if (pool.length <= anzahl) return _fisherYates([...pool]);

      const stats = _statsLaden();

      // Cooldown-Fragen herausfiltern
      const cooldownSet = new Set(_cooldownListe);
      let verfuegbar = pool.filter(f => !cooldownSet.has(f.frage || ''));

      // Falls nach Cooldown zu wenige übrig: alle nehmen
      if (verfuegbar.length < anzahl) verfuegbar = [...pool];

      // Gewichte berechnen
      const gewichtet = verfuegbar.map(f => {
        const key = _frageHash(f);
        const s = stats[key];
        let gewicht;
        if (!s) {
          // Noch nie beantwortet → leicht erhöht (Coverage sicherstellen)
          gewicht = 1.5;
        } else {
          // Mehr Fehler = höheres Gewicht, mehr Richtig = niedrigeres
          gewicht = Math.max(0.2, 1 + (s.f * 2) - (s.r * 0.5));
        }
        return { frage: f, gewicht };

      const ausgewaehlt = [];
      while (ausgewaehlt.length < anzahl && gewichtet.length > 0) {
        const gesamtGewicht = gewichtet.reduce((sum, g) => sum + g.gewicht, 0);
        let zufall = Math.random() * gesamtGewicht;
        for (let i = 0; i < gewichtet.length; i++) {
          zufall -= gewichtet[i].gewicht;
          if (zufall <= 0) {
            ausgewaehlt.push(gewichtet[i].frage);
            gewichtet.splice(i, 1);
            break;
          }
        }

      return _fisherYates(ausgewaehlt);

            const frageTexte = new Set(pool.map(f => f.frage));

        1: typeof WELT1 !== 'undefined' ? WELT1 : null,
        2: typeof WELT2 !== 'undefined' ? WELT2 : null,
        3: typeof WELT3 !== 'undefined' ? WELT3 : null,
        4: typeof WELT4 !== 'undefined' ? WELT4 : null,
      };

      const welt = weltDaten[weltNr];
      const key  = weltNr + '-' + subNr;

      if (welt && welt[key] && welt[key].fragen && welt[key].fragen.length > 0) {
        return _gewichteteAuswahl(welt[key].fragen, 10);
      }

      // Fallback: Platzhalter-Fragen
      return [
        { typ: 'multiple_choice', frage: 'Platzhalter-Frage 1 (Welt ' + weltNr + '.' + subNr + ')', optionen: ['Richtige Antwort', 'Falsch B', 'Falsch C', 'Falsch D'], richtig: 0, erklaerung: 'Platzhalter.' },
        { typ: 'richtig_falsch', frage: 'Platzhalter-Aussage (Welt ' + weltNr + '.' + subNr + ')', richtig: true, erklaerung: 'Platzhalter.' },
      ];
    }

    // ================================================================
    //  Fragen für einen Bosskampf laden
    //  Welt 1-4: Fragen aus der eigenen Welt (Klassendaten)
    //  Welt 5: Fragen aus ALLEN vorherigen Welten gemischt
    // ================================================================
    function fragenFuerBoss(weltNr) {
      const weltDaten = {
        1: typeof WELT1 !== 'undefined' ? WELT1 : null,
        2: typeof WELT2 !== 'undefined' ? WELT2 : null,
        3: typeof WELT3 !== 'undefined' ? WELT3 : null,
        4: typeof WELT4 !== 'undefined' ? WELT4 : null,
        5: typeof WELT5 !== 'undefined' ? WELT5 : null,
      };
      const klassen = {
        1: typeof KLASSE1 !== 'undefined' ? KLASSE1 : null,
        2: typeof KLASSE2 !== 'undefined' ? KLASSE2 : null,
        3: typeof KLASSE3 !== 'undefined' ? KLASSE3 : null,
        4: typeof KLASSE4 !== 'undefined' ? KLASSE4 : null,
        5: typeof KLASSE5 !== 'undefined' ? KLASSE5 : null,
      };

      // Fragen aus einer Welt sammeln (WELT-Daten + KLASSE-Daten)
      function _fragenAusWelt(w) {
        const fragen = [];
        // Aus WELT-Daten (Subwelten)
        const welt = weltDaten[w];
        if (welt) {
          for (let s = 1; s <= 5; s++) {
            const sub = welt[w + '-' + s];
            if (sub?.fragen?.length) fragen.push(...sub.fragen);
          }
        }
        // Aus KLASSE-Daten (Kategorien)
        const klasse = klassen[w];
        if (klasse?.kategorien?.length) {
          fragen.push(...klasse.kategorien.flatMap(k => k.fragen ?? []));
        }
        return fragen;
      }

      let alle = [];

      if (weltNr === 5) {
        // Endkampf: Fragen aus ALLEN 4 vorherigen Welten
        for (let w = 1; w <= 4; w++) {
          alle.push(..._fragenAusWelt(w));
        }
      } else {
        alle = _fragenAusWelt(weltNr);
      }

      // Falls keine echten Daten: Fallback auf Beispielfragen
      if (alle.length === 0) {
        if (weltNr === 5) {
          for (let w = 1; w <= 4; w++) {
            alle.push(...(BEISPIEL_FRAGEN[w] ?? []));
          }
        } else {
          alle = [...(BEISPIEL_FRAGEN[weltNr] ?? BEISPIEL_FRAGEN[1])];
        }
      }

      // Boss bekommt 15 gewichtete Fragen (werden zyklisch wiederholt)
      return _gewichteteAuswahl(alle, 15);
    }

    // ================================================================
    //  URL-Parameter lesen (shared für beide Phasen)
    // ================================================================
    const params   = new URLSearchParams(window.location.search);
    const weltNr   = parseInt(params.get('welt') ?? '1', 10);
    const subNr    = parseInt(params.get('sub') ?? '0', 10);
    const isBoss   = params.has('boss');
    const isDaily  = params.has('daily');
    const phase    = params.get('phase') ?? 'theorie';   // 'theorie' | 'quiz'
    const modus    = params.get('modus') ?? '';           // '' | 'thema'
    const themaKey = params.get('thema') ?? '';           // z. B. 'nomen', 'das-dass'
    const istThemaQuiz = (modus === 'thema' && themaKey);

    // ================================================================
    //  Profil & Einstellungen laden (shared)
    // ================================================================
    const spieler     = spielerLaden();
    const sprache     = spracheLaden();
    const tapModus    = spieler.sprachModus === 'tap';
    const zielSprache = sprache.sprache ?? 'de';

    // ================================================================
    //  Avatar rendern (shared – Emotion je nach Phase)
    // ================================================================
    avatarAnzeigen(spieler.avatar, spieler.hat, spieler.glasses, {
      containerId:  'avatar-container',
      groesse:      'avatar-lg',
      startEmotion: phase === 'quiz' ? 'happy' : 'cool',
      badge:        spieler.badge,
    });

    // ================================================================
    //  Zurück-Link (shared)
    // ================================================================
    document.getElementById('backLink').textContent =
      istThemaQuiz ? '← Themen' : '← Welten';

    // ================================================================
    //  QUIZ-PHASE: Engine starten → Theorie-Inhalt überspringen
    // ================================================================
    if (phase === 'quiz') {
      // Badge + Titel bestimmen
      const themaLabel = themaKey.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      if (istThemaQuiz) {
        document.getElementById('themaBadge').textContent = `📚 ${themaLabel}`;
        document.title = `Deutsch Trainer – ${themaLabel}`;
      } else if (isBoss) {
        document.getElementById('themaBadge').textContent = `⚔️ Bosskampf · Welt ${weltNr}`;
        document.title = `Deutsch Trainer – Bosskampf Welt ${weltNr}`;
      } else if (subNr > 0) {
        document.getElementById('themaBadge').textContent = `🌍 Welt ${weltNr}.${subNr}`;
        document.title = `Deutsch Trainer – Welt ${weltNr}.${subNr}`;
      } else {
        document.getElementById('themaBadge').textContent = isDaily ? '⚡ Challenge' : `Welt ${weltNr}`;
        document.title = `Deutsch Trainer – Quiz`;
      }

      // Fragen laden
      let fragen;
      const quizOptionen = { weltNr, containerId: 'theoriKarte' };
      if (istThemaQuiz) {
        fragen = fragenFuerThema(themaKey);
        quizOptionen.xpProAntwort = 5;
      } else if (isBoss) {
        fragen = fragenFuerBoss(weltNr);
        quizOptionen.isBoss = true;
      } else if (subNr > 0) {
        fragen = fragenFuerSubwelt(weltNr, subNr);
        quizOptionen.subNr = subNr;
      } else {
        fragen = fragenFuerWelt(weltNr);
      }
      quizStarten(fragen, quizOptionen);

      // ── Zurück-Button: Bestätigung vor Abbruch ────────────────
      const _backLink   = document.getElementById('backLink');
      const _modal      = document.getElementById('abbruch-modal');
      const _btnJa      = document.getElementById('abbruchJa');
      const _btnNein    = document.getElementById('abbruchNein');

      _backLink.textContent = '← Zurück';
      _backLink.classList.add('quiz-zurueck');

      _backLink.addEventListener('click', e => {
        e.preventDefault();
        _modal.classList.add('sichtbar');
        _btnJa.focus();
      });

      _btnJa.addEventListener('click', () => {
        window.location.href = istThemaQuiz ? 'themen.html' : 'app.html';
      });

      _btnNein.addEventListener('click', () => {
        _modal.classList.remove('sichtbar');
        _backLink.focus();
      });

      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && _modal.classList.contains('sichtbar')) {
          _modal.classList.remove('sichtbar');
        }
      });

    } else {
      // ================================================================
      //  THEORIE-PHASE: Inhalt aufbauen
      // ================================================================

      if (istThemaQuiz) {
        // ── Themen-Theorie ──────────────────────────────────────
        const themaObj = (typeof THEMEN !== 'undefined' && THEMEN[themaKey]) ? THEMEN[themaKey] : null;
        const theorie  = themaObj ? themaObj.theorie : null;

        if (!theorie) {
          // Fallback: direkt zum Quiz
          window.location.href = `quiz.html?modus=thema&thema=${encodeURIComponent(themaKey)}&phase=quiz`;
        } else {
          const themaLabel = themaKey.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
          document.getElementById('themaBadge').textContent = `📚 ${themaLabel} · Theorie`;
          document.title  = `Deutsch Trainer – ${theorie.titel}`;
          document.getElementById('theorieTitel').textContent = theorie.titel;

          // Erklärung – Wort-für-Wort antippbar wenn Übersetzungsmodus aktiv
          const erklaerungEl = document.getElementById('erklaerungText');
          if (tapModus && zielSprache !== 'de') {
            erklaerungEl.innerHTML = '';
            erklaerungEl.appendChild(_quizFrageZuSpans(theorie.erklaerung));
          } else {
            erklaerungEl.textContent = theorie.erklaerung;
          }

          // Beispiel – Wort-für-Wort antippbar wenn Übersetzungsmodus aktiv
          const beispielEl = document.getElementById('beispielSatz');
          if (tapModus && zielSprache !== 'de') {
            const plainText = theorie.beispiel.replace(/<[^>]*>/g, '');
            beispielEl.innerHTML = '';
            beispielEl.appendChild(_quizFrageZuSpans(plainText));
          } else {
            beispielEl.innerHTML = theorie.beispiel;
          }

          // Satz-Übersetzungs-Button unter dem Beispielsatz
          if (zielSprache !== 'de' && typeof _uebersetzerBlock === 'function') {
            const beispielBlock = document.querySelector('.beispiel-block');
            if (beispielBlock) {
              beispielBlock.appendChild(
                _uebersetzerBlock(
                  () => document.getElementById('beispielSatz').textContent.trim(),
                  zielSprache
                )
              );
            }
          }

          // Merkhilfe – Wort-für-Wort antippbar wenn Übersetzungsmodus aktiv
          const merkhilfeEl = document.getElementById('merkhilfeText');
          if (tapModus && zielSprache !== 'de') {
            merkhilfeEl.innerHTML = '';
            merkhilfeEl.appendChild(_quizFrageZuSpans(theorie.merkhilfe));
          } else {
            merkhilfeEl.textContent = theorie.merkhilfe;
          }

          // Wie erkennen (nur bei Themen-Theorie) – Wort-für-Wort antippbar
          const wieBlock = document.getElementById('wieErkennenBlock');
          wieBlock.style.display = 'flex';
          const wieErkennenEl = document.getElementById('wieErkennenText');
          if (tapModus && zielSprache !== 'de') {
            wieErkennenEl.innerHTML = '';
            wieErkennenEl.appendChild(_quizFrageZuSpans(theorie.wie_erkennen));
          } else {
            wieErkennenEl.textContent = theorie.wie_erkennen;
          }

          // Übersetzungs-Buttons für alle Textblöcke
          if (zielSprache !== 'de' && typeof _uebersetzerBlock === 'function') {
            erklaerungEl.parentNode.insertBefore(
              _uebersetzerBlock(() => theorie.erklaerung, zielSprache),
              erklaerungEl.nextSibling
            );

            const merkhilfeWrap = merkhilfeEl.closest('.merkhilfe');
            if (merkhilfeWrap) {
              merkhilfeWrap.parentNode.insertBefore(
                _uebersetzerBlock(() => theorie.merkhilfe, zielSprache),
                merkhilfeWrap.nextSibling
              );
            }

            const wieErkennenWrap = wieErkennenEl.closest('.wie-erkennen');
            if (wieErkennenWrap) {
              wieErkennenWrap.parentNode.insertBefore(
                _uebersetzerBlock(() => theorie.wie_erkennen, zielSprache),
                wieErkennenWrap.nextSibling
              );
            }
          }

          // Tap-to-Translate initialisieren (API-basiert)
          if (tapModus && zielSprache !== 'de') {
            _quizTapToTranslateInit();
          }

          document.getElementById('fortschrittFill').style.width = '5%';

          // "Los geht's!"-Button → zum Quiz
          document.getElementById('startBtn').addEventListener('click', () => {
            avatarEmotion('happy');
            setTimeout(() => {
              window.location.href = `quiz.html?modus=thema&thema=${encodeURIComponent(themaKey)}&phase=quiz`;
            }, 400);
          });
        }

      } else if (subNr > 0) {
        // ── Unterwelt-Theorie ────────────────────────────────────
        const subKey  = weltNr + '-' + subNr;
        const theorie = _subweltTheorieLaden(subKey);

        if (!theorie) {
          window.location.href = `quiz.html?welt=${weltNr}&sub=${subNr}&phase=quiz`;
        } else {
          document.getElementById('themaBadge').textContent = `🌍 Welt ${weltNr}.${subNr} · Theorie`;
          document.title  = `Deutsch Trainer – ${theorie.titel}`;
          document.getElementById('theorieTitel').textContent = theorie.titel;

          // Erklärung – Wort-für-Wort antippbar im Übersetzungsmodus
          const erklaerungEl = document.getElementById('erklaerungText');
          if (tapModus && zielSprache !== 'de') {
            erklaerungEl.innerHTML = '';
            erklaerungEl.appendChild(_quizFrageZuSpans(theorie.erklaerung));
          } else {
            erklaerungEl.textContent = theorie.erklaerung;
          }

          // Beispiel
          const beispielEl = document.getElementById('beispielSatz');
          if (tapModus && zielSprache !== 'de') {
            const plainText = theorie.beispiel.replace(/<[^>]*>/g, '');
            beispielEl.innerHTML = '';
            beispielEl.appendChild(_quizFrageZuSpans(plainText));
          } else {
            beispielEl.innerHTML = theorie.beispiel;
          }

          // Satz-Übersetzungs-Button unter Beispielsatz
          if (zielSprache !== 'de' && typeof _uebersetzerBlock === 'function') {
            const beispielBlock = document.querySelector('.beispiel-block');
            if (beispielBlock) {
              beispielBlock.appendChild(
                _uebersetzerBlock(() => document.getElementById('beispielSatz').textContent.trim(), zielSprache)
              );
            }
          }

          // Merkhilfe
          const merkhilfeEl = document.getElementById('merkhilfeText');
          if (tapModus && zielSprache !== 'de') {
            merkhilfeEl.innerHTML = '';
            merkhilfeEl.appendChild(_quizFrageZuSpans(theorie.merkhilfe));
          } else {
            merkhilfeEl.textContent = theorie.merkhilfe;
          }

          // Übersetzungs-Buttons für Erklärung und Merkhilfe
          if (zielSprache !== 'de' && typeof _uebersetzerBlock === 'function') {
            erklaerungEl.parentNode.insertBefore(
              _uebersetzerBlock(() => theorie.erklaerung, zielSprache),
              erklaerungEl.nextSibling
            );
            const merkhilfeWrap = merkhilfeEl.closest('.merkhilfe');
            if (merkhilfeWrap) {
              merkhilfeWrap.parentNode.insertBefore(
                _uebersetzerBlock(() => theorie.merkhilfe, zielSprache),
                merkhilfeWrap.nextSibling
              );
            }
          }

          // Tap-to-Translate initialisieren
          if (tapModus && zielSprache !== 'de') _quizTapToTranslateInit();

          document.getElementById('fortschrittFill').style.width = '5%';

          document.getElementById('startBtn').addEventListener('click', () => {
            avatarEmotion('happy');
            setTimeout(() => {
              window.location.href = `quiz.html?welt=${weltNr}&sub=${subNr}&phase=quiz`;
            }, 400);
          });
        }

      } else if (isBoss) {
        // ── Boss-Intro ──────────────────────────────────────────
        const boss = BOSS_THEORIE[weltNr] ?? BOSS_THEORIE[1];

        document.getElementById('themaBadge').textContent = `⚔️ Bosskampf · Welt ${weltNr}`;
        document.title  = `Deutsch Trainer – ${boss.titel}`;
        document.getElementById('theorieTitel').textContent = `${boss.icon} ${boss.titel}`;

        // Erklärung
        const erklaerungEl = document.getElementById('erklaerungText');
        if (tapModus && zielSprache !== 'de') {
          erklaerungEl.innerHTML = '';
          erklaerungEl.appendChild(_quizFrageZuSpans(boss.erklaerung));
        } else {
          erklaerungEl.textContent = boss.erklaerung;
        }

        // Beispiel-Block ausblenden
        document.querySelector('.beispiel-block').style.display = 'none';

        // Merkhilfe
        const merkhilfeEl = document.getElementById('merkhilfeText');
        if (tapModus && zielSprache !== 'de') {
          merkhilfeEl.innerHTML = '';
          merkhilfeEl.appendChild(_quizFrageZuSpans(boss.merkhilfe));
        } else {
          merkhilfeEl.textContent = boss.merkhilfe;
        }

        // Übersetzungs-Buttons
        if (zielSprache !== 'de' && typeof _uebersetzerBlock === 'function') {
          erklaerungEl.parentNode.insertBefore(
            _uebersetzerBlock(() => boss.erklaerung, zielSprache),
            erklaerungEl.nextSibling
          );
        }

        if (tapModus && zielSprache !== 'de') _quizTapToTranslateInit();

        document.getElementById('fortschrittFill').style.width = '5%';

        const startBtnEl = document.getElementById('startBtn');
        startBtnEl.innerHTML = 'Kampf starten! ⚔️';
        startBtnEl.addEventListener('click', () => {
          avatarEmotion('happy');
          setTimeout(() => {
            window.location.href = `quiz.html?welt=${weltNr}&boss=1&phase=quiz`;
          }, 400);
        });

      } else {
        // ── Fallback (Daily / Legacy): direkt zum Quiz ──────────
        window.location.href = isDaily
          ? 'quiz.html?daily=1&phase=quiz'
          : 'app.html';
      } // end theory branches
    } // end else (theorie)

    // Sound-Toggle initialisieren
    soundToggleInit('soundToggleBtn');

    // Herzen-Anzeige initialisieren
    if (typeof herzAnzeigenAktualisieren === 'function') herzAnzeigenAktualisieren();
  </script>
</body>
</html>
